<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Blog preview card</title>
    <link
      href="https://fonts.googleapis.com/css?family=Figtree:300,regular,500,600,700,800,900,300italic,italic,500italic,600italic,700italic,800italic,900italic"
      rel="stylesheet"
    />

  </head>

  <body>
    <main class="wrapper">
      <div class="card">
        <img class="svg" src="assets/images/illustration-article.svg" alt="Article illustration" />
        <span class="tag">Learning</span>

        <h3 class="date">Published 21 Dec 2023</h3>

        <h1 class="title">HTML & CSS foundations</h1>

        <p class="description">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
        <div class="author">
          <img src="assets/images/image-avatar.webp" alt="Greg Hooper" />
          <h3>Greg Hooper</h3>
        </div>
      </div>
    </main>

  </body>
</html>
